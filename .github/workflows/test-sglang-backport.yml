name: test-sglang-backport

on:
  pull_request:
    paths:
      - "container/apply_sglang_disconnect_abort_backport.py"
      - "container/tests/**"
      - "container/Dockerfile*"
      - ".github/workflows/test-sglang-backport.yml"
  push:
    branches: [main]
    paths:
      - "container/apply_sglang_disconnect_abort_backport.py"
      - "container/tests/**"
      - "container/Dockerfile*"
      - ".github/workflows/test-sglang-backport.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test pinned SGLang backport
        run: python -m unittest discover -s container/tests -v
